stages:
  - test

.python: &python
  image: python:3.12-slim
  before_script:
    - pip install --quiet --no-cache-dir uv==0.11.14
    - uv sync --frozen
  cache:
    key:
      files:
        - uv.lock
    paths:
      - .venv/
  variables:
    UV_PROJECT_ENVIRONMENT: .venv
    UV_LINK_MODE: copy
    PIP_DISABLE_PIP_VERSION_CHECK: "1"

pytest:
  <<: *python
  stage: test
  script:
    - uv run pytest --junitxml=report.xml -q
  artifacts:
    when: always
    reports:
      junit: report.xml
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
